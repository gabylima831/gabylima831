name: Generate Snake Animation

on:
  schedule:
    - cron: "17 0 * * *" # Executa uma vez por dia

  workflow_dispatch:
  
permissions:
  contents: write
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 

      - name: Gerar a snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: "gabylima831" 
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            snake.svg
            snake-dark.svg?palette=github-dark

      - name: Commit e push da animação
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add snake.svg snake-dark.svg

          git diff --cached --quiet || git commit -m "chore: update github snake"

          git push
